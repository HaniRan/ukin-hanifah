<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Membuat Halaman Web Statis dengan HTML</title>
<style>
  :root { --ink:#1B1F2A; --ink2:#2B3040; --red:#C8203A; --red2:#A81A30; --amber:#F2A541; --blue:#2F6FB3; --green:#1E8C6E; --light:#F3F4F7; --muted:#5B6272; --purple:#6B2BB8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--light); color:var(--ink); font-family:"Segoe UI",Calibri,Arial,sans-serif; overflow:hidden; }
  body { transition: background .5s; }
  body.dark { background:var(--ink); color:#fff; } body.red { background:var(--red); color:#fff; }
  #stage { position:absolute; inset:0; padding:5vh 5vw; display:flex; flex-direction:column; }
  .deco { position:absolute; border-radius:50%; z-index:0; pointer-events:none; }
  .slide { position:relative; z-index:1; flex:1; min-height:0; display:flex; flex-direction:column; }
  .kicker { font-size:clamp(14px,1.4vw,24px); letter-spacing:.16em; text-transform:uppercase; color:var(--red); font-weight:800; }
  body.dark .kicker { color:var(--amber); } body.red .kicker { color:#FFE2B8; }
  h1 { font-size:clamp(34px,4.6vw,84px); margin:.15em 0 .45em; line-height:1.08; }
  .big { font-size:clamp(32px,4.2vw,76px); font-weight:800; line-height:1.15; max-width:88%; }
  .lead { font-size:clamp(20px,2.2vw,40px); line-height:1.35; opacity:.85; max-width:85%; }
  .grid { display:grid; gap:2vw; grid-template-columns:repeat(var(--n,3),1fr); }
  .card { background:#fff; color:var(--ink); border-radius:28px; padding:3vh 1.8vw; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  body.dark .card.dk { background:var(--ink2); color:#fff; } body.red .card.rd { background:var(--red2); color:#fff; }
  .card h3 { margin:.2em 0 .25em; font-size:clamp(22px,2.3vw,42px); line-height:1.15; }
  .card p { margin:0; font-size:clamp(16px,1.6vw,28px); opacity:.75; line-height:1.35; }
  .ico { font-size:clamp(40px,4.6vw,86px); line-height:1; }
  .num { width:clamp(48px,4.6vw,84px); height:clamp(48px,4.6vw,84px); border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:800; font-size:clamp(22px,2.3vw,40px); }
  code { font-family:Consolas,"Courier New",monospace; }
  /* ---- animasi masuk ---- */
  .a { opacity:0; animation: up .7s cubic-bezier(.2,.8,.2,1) forwards; }
  .pop { opacity:0; animation: pop .6s cubic-bezier(.3,1.5,.5,1) forwards; }
  .fl { opacity:0; animation: fromleft .7s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes up { from { opacity:0; transform:translateY(40px);} to { opacity:1; transform:none; } }
  @keyframes pop { from { opacity:0; transform:scale(.6);} to { opacity:1; transform:none; } }
  @keyframes fromleft { from { opacity:0; transform:translateX(-80px);} to { opacity:1; transform:none; } }
  @keyframes grow { from { transform:scale(0);} to { transform:scale(1);} }
  @keyframes floaty { 50% { transform:translateY(-14px);} }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes fill { to { fill-opacity:1; } }
  @keyframes travel { 0% { left:6%; } 45%,55% { left:44%; } 100% { left:84%; } }
  @keyframes typing { from { max-width:0; } to { max-width:100%; } }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes barfill { from { width:0; } }
  .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}.d6{animation-delay:1.15s}.d7{animation-delay:1.35s}.d8{animation-delay:1.55s}.d9{animation-delay:1.75s}.d10{animation-delay:2s}
  .float { animation: floaty 4s ease-in-out infinite; }
  /* ---- komponen ---- */
  .browser { background:#fff; border-radius:22px; box-shadow:0 14px 40px rgba(0,0,0,.12); overflow:hidden; color:var(--ink); }
  .browser .bar { background:#E3E6EB; padding:1.2vh 1.2vw; display:flex; gap:.6vw; align-items:center; }
  .browser .bar i { width:12px; height:12px; border-radius:50%; display:inline-block; }
  .browser .bar span { flex:1; background:#fff; border-radius:999px; padding:.5vh 1vw; font-size:clamp(12px,1.1vw,18px); color:var(--muted); }
  .src { background:#1E1E24; color:#eee; font-family:Consolas,monospace; font-size:clamp(14px,1.45vw,26px); line-height:1.55; padding:2.5vh 2vw; }
  .src .t { color:#F2A541; } .src .s { color:#9CC3FF; } .src .a2 { color:#7FD1B9; }
  .src .ln { overflow:hidden; white-space:nowrap; max-width:100%; animation: typing 1s steps(30) both; }
  .flow { position:relative; display:flex; justify-content:space-between; align-items:center; margin-top:4vh; }
  .flow .card { width:26%; text-align:center; }
  .packet { position:absolute; top:calc(50% - 10vh); background:var(--amber); color:var(--ink); font-family:Consolas,monospace; font-weight:800; padding:.8vh 1vw; border-radius:12px; font-size:clamp(14px,1.3vw,22px); animation: travel 4.5s ease-in-out 1s infinite; left:6%; }
  .line { position:absolute; left:13%; right:13%; top:50%; border-top:4px dashed rgba(0,0,0,.15); z-index:-1; }
  .sched { display:flex; flex-direction:column; gap:2.4vh; margin-top:2vh; }
  .sched .row { display:flex; align-items:center; gap:1.5vw; font-size:clamp(18px,1.9vw,34px); font-weight:700; }
  .sched .row .lbl { width:24%; }
  .sched .row .b { height:clamp(36px,5vh,64px); border-radius:16px; display:flex; align-items:center; padding:0 1.2vw; color:#fff; animation: barfill 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .big-timer { font-size:clamp(80px,13vw,240px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  .check { margin:0; padding-left:1.4em; } .check li { font-size:clamp(16px,1.65vw,28px); margin:.4em 0; }
  .qopt { display:flex; align-items:center; gap:1.2vw; background:var(--light); border-radius:20px; padding:2vh 1.4vw; font-size:clamp(18px,2vw,36px); font-weight:600; transition:background .3s, transform .3s; }
  .qopt b { width:clamp(40px,3.6vw,64px); height:clamp(40px,3.6vw,64px); border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; flex:none; }
  .qopt.ok { background:#DDF2E7; transform:scale(1.02); } .qopt.ok b { background:var(--green); }
  .qopt.no { filter:grayscale(1) opacity(.45); }
  .qzdots { display:flex; gap:.5vw; } .qzdots i { width:14px; height:14px; border-radius:50%; background:#D5D8DF; display:inline-block; } .qzdots i.on { background:var(--red); transform:scale(1.3); }
  .uraian { font-size:clamp(16px,1.7vw,30px); color:var(--muted); background:var(--light); border-radius:18px; padding:2vh 1.4vw; line-height:1.45; }
  .frame { flex:1; min-height:0; border:0; border-radius:22px; width:100%; background:#fff; }
  /* presensi */
  .pgrid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(5,1fr); grid-auto-rows:1fr; gap:1.2vw; }
  .ptile { border:0; background:#fff; border-radius:20px; box-shadow:0 4px 14px rgba(0,0,0,.07); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8vh; font:inherit; font-size:clamp(14px,1.45vw,26px); font-weight:700; color:var(--ink); padding:1vh .6vw; cursor:pointer; transition:transform .1s, background .2s; text-align:center; }
  .ptile:active { transform:scale(.96); }
  .ptile .st { font-size:clamp(12px,1.1vw,18px); padding:.3em .9em; border-radius:999px; background:#E9EBF0; color:var(--muted); }
  .ptile.H { background:#E3F4EC; } .ptile.H .st { background:var(--green); color:#fff; }
  .ptile.S { background:#FFF2DF; } .ptile.S .st { background:var(--amber); color:#fff; }
  .ptile.I { background:#E7F1FB; } .ptile.I .st { background:var(--blue); color:#fff; }
  .ptile.A { background:#FBE9EC; } .ptile.A .st { background:var(--red); color:#fff; }
  .ptop { display:flex; justify-content:space-between; align-items:flex-end; gap:2vw; margin-bottom:2vh; }
  .chips { display:flex; gap:.8vw; flex-wrap:wrap; }
  .chip { border-radius:999px; padding:.7vh 1.2vw; font-weight:800; font-size:clamp(13px,1.2vw,20px); background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .btn { border:0; border-radius:999px; padding:1vh 1.4vw; font:inherit; font-weight:700; font-size:clamp(13px,1.2vw,20px); cursor:pointer; background:var(--ink); color:#fff; }
  .btn.ghost { background:#fff; color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  /* video */
  .vidwrap { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; gap:1.4vh; }
  .vidwrap video { flex:1; min-height:0; width:100%; background:#000; border-radius:22px; }
  .segs { display:flex; gap:.6vw; flex-wrap:wrap; }
  .seg { border:0; border-radius:999px; padding:.8vh 1.1vw; background:#fff; color:var(--ink); font-weight:700; font-size:clamp(12px,1.1vw,18px); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .seg.on { background:var(--red); color:#fff; } .seg.done { background:#DDEFE7; color:var(--green); }
  .qover { position:absolute; left:0; right:0; bottom:0; display:none; justify-content:center; padding:0 2vw 2.2vh; pointer-events:none; }
  .qover.on { display:flex; animation: up .45s cubic-bezier(.2,.8,.2,1); }
  .qbox { pointer-events:auto; background:#fff; color:var(--ink); border-radius:22px; padding:1.8vh 2vw; width:100%; max-width:94%; display:flex; align-items:center; gap:1.6vw; box-shadow:0 10px 34px rgba(0,0,0,.35); border-left:10px solid var(--red); }
  .qbox .k { color:var(--red); font-weight:800; letter-spacing:.12em; font-size:clamp(11px,1vw,16px); white-space:nowrap; }
  .qbox .q { flex:1; font-size:clamp(20px,2.3vw,42px); font-weight:800; line-height:1.2; margin:0; }
  /* timer guru */
  #timer { position:fixed; top:8px; right:12px; font:600 12px/1.25 Consolas,monospace; color:rgba(80,86,100,.42); z-index:50; cursor:pointer; user-select:none; text-align:right; }
  body.dark #timer, body.red #timer { color:rgba(255,255,255,.4); }
  #timer .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:rgba(120,126,140,.4); margin-right:5px; }
  #timer.warn .dot { background:rgba(242,165,65,.9); } #timer.over .dot { background:rgba(200,32,58,.95); } #timer.hide { display:none; } #timer.paused { opacity:.55; }
  #nav { position:fixed; right:10px; bottom:10px; display:flex; gap:6px; z-index:60; opacity:.3; } #nav:hover { opacity:1; }
  #nav button { border:0; width:40px; height:40px; border-radius:50%; background:rgba(27,31,42,.7); color:#fff; font-size:16px; cursor:pointer; }
  #start { position:fixed; inset:0; background:var(--ink); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vh; z-index:100; text-align:center; padding:4vw; }
  #start button { border:0; background:var(--red); color:#fff; border-radius:999px; padding:2vh 4vw; font-size:clamp(18px,2vw,32px); font-weight:800; cursor:pointer; }
  #start .keys { color:#B7BDC9; font-size:clamp(12px,1.2vw,18px); line-height:1.9; }
</style>
</head>

let acc = 0; STEPS.forEach(s => { s.start = acc; acc += s.m; s.end = acc; });

const $ = id => document.getElementById(id);
let idx = 0, t0 = null, pausedAt = null, pauseTotal = 0, stepEnter = 0;
const elapsed = () => t0 === null ? 0 : ((pausedAt ?? Date.now()) - t0 - pauseTotal) / 1000;
const mmss = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

function render() {
  const s = STEPS[idx];
  document.body.className = s.theme || "";
  $("stage").innerHTML = (s.deco || "") + `<div class="slide">${s.html}</div>`;
  stepEnter = elapsed();
  if (s.video) setupVideo();
  if (s.presensi) setupPresensi();
  if (s.tepuk) setupTepuk();
  if (s.lagu) setupLagu();
  if (s.cuaca) setupCuaca();
  if (s.quiz) setupQuiz();
  tick();
}
function tick() {
  const s = STEPS[idx], e = elapsed(), inStep = e - stepEnter, left = s.m * 60 - inStep;
  const tm = $("timer");
  tm.innerHTML = `<span class="dot"></span>${mmss(inStep)} / ${s.m}:00 · sisa ${left >= 0 ? mmss(left) : "+" + mmss(-left)}<br>total ${mmss(e)} / ${acc}:00 · target ${mmss(s.end * 60)}`;
  tm.classList.toggle("warn", left < 60 && left >= 0); tm.classList.toggle("over", left < 0); tm.classList.toggle("paused", pausedAt !== null);
  if (s.lkpd && $("lk")) $("lk").textContent = left >= 0 ? mmss(left) : "00:00";
}
setInterval(tick, 500);

const PKEY = "presensi.uk.v2"; const ORDER = ["", "H", "S", "I", "A"], LBL = { "": "Belum", H: "Hadir", S: "Sakit", I: "Izin", A: "Alpa" };

try { const x = JSON.parse(localStorage.getItem(PKEY)); if (Array.isArray(x) && x.length === 15) pst = x; } catch (e) {}
const psave = () => { try { localStorage.setItem(PKEY, JSON.stringify(pst)); } catch (e) {} };
function setupPresensi() {

    g.innerHTML = NAMES.map((n, i) => `<button class="ptile ${pst[i]} pop" style="animation-delay:${i * 0.04}s" data-i="${i}"><span style="opacity:.5;font-size:.75em">${i + 1}</span>${n}<span class="st">${LBL[pst[i]]}</span></button>`).join("");
    g.querySelectorAll(".ptile").forEach(b => b.onclick = () => { const i = +b.dataset.i; pst[i] = ORDER[(ORDER.indexOf(pst[i]) + 1) % ORDER.length]; psave(); b.className = "ptile " + pst[i]; b.querySelector(".st").textContent = LBL[pst[i]]; chips(); });
    chips();
  };
  const chips = () => {
    const c = k => pst.filter(x => x === k).length;
    $("pchips").innerHTML = `<span class="chip" style="color:var(--green)">Hadir ${c("H")}</span><span class="chip" style="color:#B5761A">Sakit ${c("S")}</span><span class="chip" style="color:var(--blue)">Izin ${c("I")}</span><span class="chip" style="color:var(--red)">Alpa ${c("A")}</span>`;
  };
  $("pall").onclick = () => { pst = pst.map(x => x || "H"); psave(); draw(); };

}

    }
  };
  $("qnext").onclick = () => { $("qover").classList.remove("on"); if (segI + 1 < SEG.length) playSeg(segI + 1); };
  v.onclick = () => togglePlay();
  [...segs.children].forEach((b, i) => b.classList.toggle("on", i === segI));
}
function playSeg(i) {
  const v = $("vid"); segI = i; $("qover").classList.remove("on");
  v.currentTime = SEG[i][0]; stopAt = SEG[i][1];
  [...$("segs").children].forEach((b, k) => b.classList.toggle("on", k === i));
  v.play().catch(() => {});
}
function togglePlay() {
  const l = $("lagu"); if (l && $("lagubtn").style.display === "none" && $("laguyt")) { try { window.open(LAGU_YT, "_blank"); } catch (e) {} return; }
  if (l && $("lagubtn").style.display !== "none") { if (l.paused) l.play().catch(() => {}); else l.pause(); return; }
  const v = $("vid"); if (!v) return;
  if (stopAt === null && !$("qover").classList.contains("on")) { playSeg(segI); return; }
  if (v.paused) { $("qover").classList.remove("on"); v.play().catch(() => {}); } else v.pause();
}

// ---------- kontrol ----------
function go(d) { const n = idx + d; if (n < 0 || n >= STEPS.length) return; const v = $("vid"); if (v) v.pause(); const l = $("lagu"); if (l) l.pause(); idx = n; stopAt = null; render(); }
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
function togglePause() { if (t0 === null) return; if (pausedAt === null) pausedAt = Date.now(); else { pauseTotal += Date.now() - pausedAt; pausedAt = null; } tick(); }
$("timer").onclick = togglePause;
$("go").onclick = () => { t0 = Date.now(); $("start").remove(); render(); try { document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
document.addEventListener("keydown", e => {
  if ($("start")) { if (e.key === "Enter" || e.key === " ") $("go").click(); return; }
  const k = e.key.toLowerCase();
  if (["ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (k === "t") $("timer").classList.toggle("hide");
  else if (k === "p") togglePause();
  else if (k === "f") { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
});

// ================== SINKRON KE LAYAR MONITOR (PC lain, link #monitor) ==================
const MON = () => location.hash === "#monitor";
let ROOM = null;
let BC = null; try { BC = new BroadcastChannel("ukin-sync"); } catch (e) {}
// sinkron antar-PC lewat internet (untuk hosting biasa, mis. Vercel)
const NTFY = "https://ntfy.sh/ukin-hanifah-xi-7q4k9m2z";
let ntfyLast = "";
function ntfySend(st) {
  if (!st.started) return;
  const sig = [st.started, st.idx, st.paused].join("|");
  if (sig === ntfyLast) return; ntfyLast = sig;
  try { fetch(NTFY, { method: "POST", body: JSON.stringify(st) }).catch(() => { ntfyLast = ""; }); } catch (e) {}
}
function pubState() {
  if (MON()) return;
  const st = { v: 1, started: t0 !== null, idx, n: STEPS.length, e: Math.round(elapsed() * 10) / 10, se: Math.round(stepEnter * 10) / 10, paused: pausedAt !== null, k: Date.now() };
  if (BC) try { BC.postMessage(st); } catch (e) {}
  try { localStorage.setItem('ukin.state', JSON.stringify(st)); } catch (e) {}
  if (ROOM) ROOM.presence({ ukin: st }).catch(() => {});
  ntfySend(st);
}
const _render0 = render; render = function () { _render0(); pubState(); };
const _tp0 = togglePause; togglePause = function () { _tp0(); pubState(); };
$("timer").onclick = togglePause;
setInterval(pubState, 5000);

// ---------- tampilan monitor (hitam putih, satu layar) ----------
let monEl = null, monSrc = null, monRecv = 0, monPeer = null, monConn = false;
function buildMonitor() {
  if (monEl) return;
  const css = document.createElement("style");
  css.textContent = `
  #mon{position:fixed;inset:0;z-index:9999;background:#000;color:#fff;font-family:"Segoe UI",Arial,sans-serif;display:grid;grid-template-rows:auto 1fr auto;padding:3vh 4vw;gap:1.5vh;overflow:hidden;cursor:pointer;user-select:none}
  #mon .row{display:flex;justify-content:space-between;align-items:baseline;gap:2vw}
  #mon .lab{font-size:1.6vw;letter-spacing:.25em;text-transform:uppercase;opacity:.6}
  #mon .big{font-variant-numeric:tabular-nums;font-weight:800;line-height:1;white-space:nowrap}
  #mon .tot{font-size:min(6vw,10vh)}
  #mon .main{border:.4vw solid #fff;border-radius:1.5vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2vh 3vw}
  #mon .main.over{background:#fff;color:#000}
  #mon .main.warn{animation:mblink 1s steps(2) infinite}
  @keyframes mblink{50%{border-style:dashed}}
  #mon .sname{font-size:min(4.2vw,7vh);font-weight:700;margin:1vh 0 2vh}
  #mon .clock{font-size:min(16vw,26vh)}
  #mon .sub{font-size:2.6vw;margin-top:1.5vh;font-variant-numeric:tabular-nums}
  #mon .bar{height:1.2vh;background:#333;border-radius:1vh;overflow:hidden;width:100%;margin-top:2vh}
  #mon .bar i{display:block;height:100%;background:#fff}
  #mon .main.over .bar{background:#bbb} #mon .main.over .bar i{background:#000}
  #mon .foot{font-size:2.2vw}
  #mon .st{font-size:1.4vw;opacity:.6}
  #mon .wait{font-size:4vw;opacity:.8}`;
  document.head.appendChild(css);
  monEl = document.createElement("div"); monEl.id = "mon";
  monEl.onclick = () => { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  document.body.appendChild(monEl);
  const s = $("start"); if (s) s.style.display = "none";
  monDraw(); setInterval(monDraw, 250);
}
function monDraw() {
  if (!monEl) return;
  const conn = monConn ? "● tersambung ke layar presentasi" : "○ menunggu layar presentasi…";
  const p = monSrc;
  if (!p || !p.started) {
    monEl.innerHTML = `<div class="row"><span class="lab">Monitor Waktu · UKIN</span><span class="st">${conn}</span></div>
      <div class="main"><div class="wait">${p ? "Menunggu guru menekan <b>Mulai</b>…" : "Buka web guru di laptop utama dan tekan Mulai"}</div></div>
      <div class="row foot"><span>Total ${acc} menit · ${STEPS.length} slide</span><span class="st">klik layar = layar penuh</span></div>`;
    return;
  }
  const e = p.paused ? p.e : p.e + (Date.now() - monRecv) / 1000;
  const i = Math.min(Math.max(p.idx | 0, 0), STEPS.length - 1), s = STEPS[i], nx = STEPS[i + 1];
  const inStep = e - p.se, dur = s.m * 60, left = dur - inStep;
  const late = p.se - s.start * 60;
  const jadwal = Math.abs(late) < 30 ? "sesuai jadwal" : (late > 0 ? "terlambat " + mmss(late) : "lebih cepat " + mmss(-late));
  const cls = left < 0 ? "over" : (left < 60 ? "warn" : "");
  monEl.innerHTML = `
    <div class="row">
      <div><div class="lab">Menit ke-</div><div class="big tot">${Math.floor(e / 60) + 1}<span style="font-size:.45em;opacity:.6"> / ${acc}</span></div></div>
      <div style="text-align:center"><div class="lab">Total berjalan</div><div class="big" style="font-size:4vw">${mmss(e)}</div></div>
      <div style="text-align:right"><div class="lab">Slide</div><div class="big tot">${i + 1}<span style="font-size:.45em;opacity:.6"> / ${STEPS.length}</span></div></div>
    </div>
    <div class="main ${cls}">
      <div class="lab" style="opacity:.8">${p.paused ? "⏸ TIMER DIJEDA" : "Sedang dijelaskan"}</div>
      <div class="sname">${s.t}</div>
      <div class="big clock">${mmss(inStep)}</div>
      <div class="sub">jatah ${s.m} menit · ${left >= 0 ? "sisa " + mmss(left) : "LEWAT " + mmss(-left)}</div>
      <div class="bar"><i style="width:${Math.min(100, inStep / dur * 100)}%"></i></div>
    </div>
    <div class="row foot">
      <span>Target slide ini selesai di menit ${s.end} · ${jadwal}</span>
      <span>${nx ? "Berikutnya: <b>" + nx.t + "</b> (" + nx.m + "′)" : "Slide terakhir"}</span>
    </div>
    <div class="row"><span class="st">${conn}</span><span class="st">klik layar = layar penuh</span></div>`;
  monEl.style.gridTemplateRows = "auto 1fr auto auto";
}
let monSrcRef = null;
function monFromPeersSafe(peers) {
  let best = null;
  for (const q of peers) { if (q.sameTab) continue; const u = q.presence && q.presence.ukin; if (!u || typeof u !== "object" || u.v !== 1) continue; if (!best || q.updatedAt > best.updatedAt) best = q; }
  if (!best || best.presence.ukin === monSrcRef) return;
  const u = best.presence.ukin; monSrcRef = u;
  monSrc = { started: !!u.started, idx: +u.idx || 0, e: +u.e || 0, se: +u.se || 0, paused: !!u.paused }; monRecv = Date.now();
}
let monLastK = 0;
function monLocal(u) { if (!u || u.v !== 1 || !u.started) return; const k = +u.k || 0; if (k < monLastK) return; if (k && Date.now() - k + (+u.e || 0) * 1000 > 2.5 * 3600e3) return; monLastK = k; monSrc = { started: !!u.started, idx: +u.idx || 0, e: +u.e || 0, se: +u.se || 0, paused: !!u.paused }; monRecv = Math.min(Date.now(), +u.k || Date.now()); monConn = true; }
if (BC) BC.onmessage = ev => { if (MON()) monLocal(ev.data); };
window.addEventListener("storage", ev => { if (MON() && ev.key === "ukin.state") try { monLocal(JSON.parse(ev.newValue)); } catch (e) {} });
let ntfyES = null;
function ntfyListen() {
  if (ntfyES || !window.EventSource) return;
  try {
    ntfyES = new EventSource(NTFY + "/sse?since=3h");
    ntfyES.onopen = () => { monConn = true; };
    ntfyES.onerror = () => { monConn = false; };
    ntfyES.onmessage = ev => {
      try { const m = JSON.parse(ev.data); if (m.event !== "message") return; const u = JSON.parse(m.message); monLocal(u); } catch (e) {}
    };
  } catch (e) {}
}
function checkMode() { if (MON()) { buildMonitor(); ntfyListen(); try { monLocal(JSON.parse(localStorage.getItem("ukin.state"))); } catch (e) {} } }
window.addEventListener("hashchange", checkMode);
document.addEventListener("keydown", e => { if (MON()) e.stopImmediatePropagation(); }, true);
checkMode();
(async () => {
  try { ROOM = window.claude && window.claude.use ? await window.claude.use("room") : null; } catch (e) { ROOM = null; }
  if (!ROOM) return;
  ROOM.onConnection(c => { monConn = c; if (c) pubState(); }, () => { monConn = false; });
  ROOM.onPeers(ch => { if (MON()) monFromPeersSafe(ch.peers); else if (ch.joined.length) pubState(); }, () => {});
  pubState();
})();
</script>
